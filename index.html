<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laura Payan Cepeda - Portfolio</title>
  <meta name="description"
    content="Hello there, I'm Laura Payan Cepeda – Nail Technician & Nail Artist ✨ I love creating delicate, elegant sets with a touch of sparkle and glam. Currently training to become a Lash Technician 🎀">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="dist/assets/favicon.ico" />
  <link rel="stylesheet" href="dist/output.css" />
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Start - Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;700&display=swap" rel="stylesheet">
  <!-- End - Fonts -->
  <!-- Start - Fancybox Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <script src="https://code.jquery.com/jquery-3.6.3.min.js"
    integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
  <!-- End - Fancybox Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["./dist/*.{html,js}"],
      theme: {
        extend:
                {
                  fontFamily: {
                    'nothingyoucoulddo': ['Nothing You Could Do', 'cursive'],
                    'signika': ['Signika', 'sans-serif'],
                  },
                },
      },
      plugins: [],
    }
  </script>
</head>

<body
  class="dark:bg-black bg-white min-h-screen text-black dark:text-white px-5 md:px-20 opacity-0 animate-fade-in transition duration-500"
>
  <!-- Navbar -->
  <header class="flex w-full overflow-hidden pt-10 pb-1">
    <nav
      id="nav"
      x-data="{ open: false }"
      role="navigation"
      aria-label="Main navigation"
      class="w-full"
    >
      <div class="container mx-auto flex flex-wrap items-center md:flex-nowrap">

        <!-- Logo / Name -->
        <div class="mr-4 md:mr-8">
          <a
            href="index.html"
            class="text-2xl font-signika font-bold"
          >
            LAURA PAYAN CEPEDA
          </a>
        </div>

        <!-- Mobile Menu Button -->
        <div class="ml-auto md:hidden flex items-center justify-start">
          <button
            @click="open = !open"
            :aria-expanded="open"
            aria-controls="menu"
            aria-label="Toggle navigation menu"
            class="tap-highlight-transparent text-black dark:text-white w-5 h-5 relative focus:outline-none"
          >
            <span class="sr-only">Open main menu</span>

            <div
              class="block w-5 absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2"
            >
              <!-- Top line -->
              <span
                aria-hidden="true"
                class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out"
                :class="{
                  'rotate-45': open,
                  '-translate-y-1.5': !open
                }"
              ></span>

              <!-- Middle line -->
              <span
                aria-hidden="true"
                class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out"
                :class="{ 'opacity-0': open }"
              ></span>

              <!-- Bottom line -->
              <span
                aria-hidden="true"
                class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out"
                :class="{
                  '-rotate-45': open,
                  'translate-y-1.5': !open
                }"
              ></span>
            </div>
          </button>
        </div>

        <!-- Navigation Menu -->
        <div
          id="menu"
          class="w-full h-0 transition-all ease-out duration-500 md:transition-none md:w-auto md:flex-grow md:flex md:items-center"
          :class="{ 'h-auto': open }"
        >
          <ul
            id="ulMenu"
            class="flex flex-col duration-300 ease-out md:space-x-5 sm:transition-none mt-5 md:flex-row md:items-center md:ml-auto md:mt-0 md:pt-0 md:border-0"
          >

            <!-- Portfolio -->
            <li class="group transition duration-300">
              <a
                href="index.html"
                class="font-signika text-2xl tap-highlight-transparent"
              >
                PORTFOLIO
                <span class="hidden md:block h-0.5 bg-black dark:bg-white"></span>
              </a>
            </li>

            <!-- About Me -->
            <li class="group transition duration-300">
              <a
                href="dist/about_me.html"
                class="font-signika text-2xl tap-highlight-transparent"
              >
                ABOUT ME
                <span
                  class="hidden md:block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-black dark:bg-white"
                ></span>
              </a>
            </li>

            <!-- Contact -->
            <li class="group transition duration-300">
              <a
                href="dist/contact.html"
                class="font-signika text-2xl tap-highlight-transparent"
              >
                CONTACT
                <span
                  class="hidden md:block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-black dark:bg-white"
                ></span>
              </a>
            </li>

          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto">

    <!-- Page Title -->
    <h1 class="text-4xl pt-10 pb-8 font-bold">
      PORTFOLIO
    </h1>

    <!-- Gallery -->
    <section class="text-neutral-700" aria-label="Nail portfolio">

      <div class="container w-full">

        <div class="flex flex-wrap w-full">

          <!-- Left Column -->
          <div class="flex w-full md:w-1/2 flex-wrap">

            <!-- Nude Manicure -->
            <div class="w-full md:w-1/2 p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/manicure-nude.jpeg"
                  data-fancybox="gallery"
                  aria-label="View nude manicure"
                >
                  <img
                    src="dist/assets/manicure-nude.jpeg"
                    alt="Nude manicure"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

            <!-- Gold Press-ons -->
            <div class="w-full md:w-1/2 p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/press-ons-gold.jpeg"
                  data-fancybox="gallery"
                  aria-label="View gold press-ons"
                >
                  <img
                    src="dist/assets/press-ons-gold.jpeg"
                    alt="Gold press-on nails"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

            <!-- Silver Builder Gel -->
            <div class="w-full p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/builder-gel-silver.jpeg"
                  data-fancybox="gallery"
                  aria-label="View silver builder gel nails"
                >
                  <img
                    src="dist/assets/builder-gel-silver.jpeg"
                    alt="Silver builder gel nails"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

          </div>

          <!-- Right Column -->
          <div class="flex w-full md:w-1/2 flex-wrap">

            <!-- Pink Builder Gel -->
            <div class="w-full p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/builder-gel-pink.jpeg"
                  data-fancybox="gallery"
                  aria-label="View pink builder gel nails"
                >
                  <img
                    src="dist/assets/builder-gel-pink.jpeg"
                    alt="Pink builder gel nails"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

            <!-- Nude Gel Extensions -->
            <div class="w-full md:w-1/2 p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/extensions-nude-gel.jpeg"
                  data-fancybox="gallery"
                  aria-label="View nude gel extensions"
                >
                  <img
                    src="dist/assets/extensions-nude-gel.jpeg"
                    alt="Nude gel extensions"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

            <!-- Pink Press-ons -->
            <div class="w-full md:w-1/2 p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/press-ons.jpeg"
                  data-fancybox="gallery"
                  aria-label="View pink press-on nails"
                >
                  <img
                    src="dist/assets/press-ons.jpeg"
                    alt="Pink press-on nails"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

            <!-- Hard Gel Extensions -->
            <div class="w-full md:w-1/2 p-1">
              <div class="overflow-hidden h-full w-full">
                <a
                  href="dist/assets/extensions-hard-gel.jpeg"
                  data-fancybox="gallery"
                  aria-label="View hard gel extensions"
                >
                  <img
                    src="dist/assets/extensions-hard-gel.jpeg"
                    alt="Hard gel extensions"
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                  />
                </a>
              </div>
            </div>

          </div>

        </div>
      </div>
    </section>

  </main>
  <!-- Footer -->
  <footer>
    <div class="max-w-screen-xl py-16 mx-auto">
      <div class="grid grid-cols-1 gap-8 text-center mx-auto">
        <div>
          <p class="font-signika"><b>LAURA PAYAN CEPEDA</b></p>
          <p class="mt-4 text-sm text-gray-600 dark:text-gray-300">
            Abu Dhabi, United Arab Emirates
          </p>
        </div>
      </div>
    </div>
  </footer>
  <!-- Script for the LightBox -->
  <script>
    Fancybox.bind("[data-fancybox]", {});
  </script>
  <script src="dist/fade_in.js"></script>
  <script src="dist/menu.js"></script>
</body>

</html>
